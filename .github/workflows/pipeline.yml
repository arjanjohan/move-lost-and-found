name: pipeline

on:
  schedule:
    - cron: '17 3 * * 1'   # weekly snapshot, Monday 03:17 UTC
    - cron: '17 3 * * 4'   # Thursday: restore the state cache so it is not evicted (7 days without access)
  workflow_dispatch:
    inputs:
      source:
        description: 'Re-run one source id only (other sources keep their last published results); empty = all'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore: ['snapshot/**', 'spikes/**', '*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['snapshot/**', 'spikes/**', '*.md']

# docs/ is rendered into the site (How we count, Sources), so docs changes build and deploy too.
# Read-only by default; only the jobs that need more get it (PR code runs in test and preview).
permissions:
  contents: read

# Snapshot and production runs queue behind each other; a PR's runs replace its own older ones.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pipeline' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.schedule != '17 3 * * 4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  snapshot:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # commits snapshot/latest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # State is derived from chain data only; a cache miss means one full rebuild run, not lost data.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: state, key: 'state-${{ github.run_id }}', restore-keys: 'state-' }
      - run: pnpm snapshot ${SOURCE:+--source "$SOURCE"}
        env:
          GEOMI_API_KEY: ${{ secrets.GEOMI_API_KEY }}
          PANORA_API_KEY: ${{ secrets.PANORA_API_KEY }}
          SOURCE: ${{ inputs.source }}
          # Keyed Aptos requests per run (~50 compute units each, about $0.60 per 100K; measured 2026-10-25). Local runs
          # keep the code's 100K default.
          REQUEST_CAP: '300000'
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: always()
        with: { path: state, key: 'state-${{ github.run_id }}' }
      # Committing the aggregate snapshot keeps a public history and counts as repo activity
      # (GitHub disables schedules after 60 days without it).
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%F)"
          # main can move during a long run; the snapshot file never conflicts with code commits.
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1

  keep-cache:
    if: github.event.schedule == '17 3 * * 4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: state, key: 'state-keepalive', restore-keys: 'state-' }

  deploy:
    needs: [test, snapshot]
    if: always() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.snapshot.result != 'failure' && needs.snapshot.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }   # includes the snapshot commit pushed by the job above
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test   # re-runs the boundary test against dist/
      - run: |
          pnpm exec wrangler pages project create move-lost-and-found --production-branch main || true
          pnpm exec wrangler pages deploy dist --project-name move-lost-and-found --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Builds a PR's site without any secrets and hands it over as an artifact; preview.yml deploys it from main's code.
  # Same-repo branches only, and not Dependabot: the deploy side needs secrets those runs never get.
  preview-build:
    needs: test
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test   # re-runs the boundary test against dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: preview-site, path: dist, retention-days: 3, if-no-files-found: error }
